
name: macos-r2-release-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify sealed checksums
        run: shasum -a 256 -c SHA256SUMS.txt
      - name: Verify public privacy and release boundaries
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B validation/check_r2_release.py
      - run: python -m pip install -r package/requirements-client-delivery.txt
      - name: Run all 74 tests with no bytecode
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -o pipefail
          python -B -m unittest discover -s validation -p 'test*.py' -v 2>&1 | tee /tmp/r4-tests.log
          grep -Eq '^Ran 74 tests in ' /tmp/r4-tests.log
          grep -Eq '^OK$' /tmp/r4-tests.log
          test -z "$(find . -name __pycache__ -o -name '*.pyc')"
      - name: Test isolated timeline demo in a separate environment
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m venv /tmp/lv-timeline-demo-venv
          /tmp/lv-timeline-demo-venv/bin/python -m pip install -r package/requirements-timeline-demo.txt
          /tmp/lv-timeline-demo-venv/bin/python -B -m unittest discover -s package/tests -p 'test_timeline_demo.py' -v
